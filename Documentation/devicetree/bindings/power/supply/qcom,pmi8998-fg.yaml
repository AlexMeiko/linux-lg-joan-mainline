%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/qcom,pmi8998-fg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm PMI8998 fuel gauge

maintainers:
  - GuWolf <admin@guwolf.com>

description: |
  Qualcomm PMI8998 FG Gen3 exposes battery data through the BATT_SOC
  and BATT_INFO shadow peripherals. The BATT_SOC peripheral is located at
  the node base address, while BATT_INFO is fixed at base + 0x100.

properties:
  compatible:
    const: qcom,pmi8998-fg

  reg:
    maxItems: 1
    description: >-
      Base address of the BATT_SOC peripheral. The BATT_INFO peripheral
      is fixed at base + 0x100.

  monitored-battery: true

  power-supplies:
    maxItems: 1

required:
  - compatible
  - reg
  - monitored-battery
  - power-supplies

allOf:
  - $ref: power-supply.yaml#

additionalProperties: false

examples:
  - |
    #include <dt-bindings/spmi/spmi.h>

    pmic@2 {
      compatible = "qcom,pmi8998", "qcom,spmi-pmic";
      reg = <0x2 SPMI_USID>;
      #address-cells = <1>;
      #size-cells = <0>;

      fuel-gauge@4000 {
        compatible = "qcom,pmi8998-fg";
        reg = <0x4000>;
        monitored-battery = <&battery>;
        power-supplies = <&charger>;
      };
    };
